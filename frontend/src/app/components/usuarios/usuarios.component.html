<div class="container mt-4">
  <h2 class="mb-4">Administración de Usuarios</h2>

  <div class="d-flex justify-content-between mb-4">
    <button (click)="openCreateModal()" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Nuevo Usuario
    </button>

    <div *ngIf="loading$ | async" class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover table-striped">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Email</th>
          <th>Nombre</th>
          <th>Rol</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users$ | async">
          <td>{{ user?.id }}</td>
          <td>{{ user?.username }}</td>
          <td>{{ user?.email }}</td>
          <td>{{ user?.first_name }} {{ user?.last_name }}</td>
          <td>
            <span class="badge" [ngClass]="{
              'bg-primary': user?.role === 'Administrador',
              'bg-secondary': user?.role === 'Empleado',
              'bg-light text-dark': !user?.role
            }">
              {{ user?.role || 'Sin rol' }}
            </span>
          </td>
          <td class="text-end">
            <div class="btn-group" role="group">
              <button 
                (click)="openEditModal(user)" 
                class="btn btn-sm btn-warning me-1"
                title="Editar"
                [disabled]="!user?.id">
                <i class="bi bi-pencil"></i>
              </button>
              <button 
                (click)="deleteUser(user?.id)" 
                class="btn btn-sm btn-danger"
                title="Eliminar"
                [disabled]="!user?.id">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <app-user-modal 
    *ngIf="showModal && selectedUser"
    [user]="selectedUser"
    [isEditMode]="isEditMode"
    (save)="saveUser($event)"
    (cancel)="closeModal()">
  </app-user-modal>
</div>
