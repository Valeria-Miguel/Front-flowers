<div class="container mt-4">
    <h2 class="mb-4">Administración de Órdenes</h2>
  
    <div class="d-flex justify-content-between mb-4">
      <button (click)="openCreateModal()" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Nueva Orden
      </button>
  
      <div *ngIf="loading$ | async" class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  
    <div *ngIf="error$ | async as error" class="alert alert-danger">
      {{ error }}
    </div>
  
    <div class="table-responsive">
      <table class="table table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Dirección</th>
            <th>Fecha Entrega</th>
            <th>Estado</th>
            <th>Total</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders$ | async">
            <td>{{ order?.id }}</td>
            <td>{{ order?.delivery_address }}</td>
            <td>{{ order?.delivery_date | date:'short' }}</td>
            <td>
              <ng-container *ngIf="order as o">
                <span class="badge" [ngClass]="{
                  'bg-primary': o.current_state === 'PENDING',
                  'bg-info': o.current_state === 'IN_PREPARATION',
                  'bg-success': o.current_state === 'READY',
                  'bg-secondary': o.current_state === 'DELIVERED',
                  'bg-danger': o.current_state === 'CANCELLED'
                }">
                  {{ o.current_state_display || o.current_state }}
                </span>
              </ng-container>
            </td>
            <td>{{ order?.total_price | currency:'USD' }}</td>
            <td class="text-end">
              <div class="btn-group" role="group">
                <button 
                  (click)="openEditModal(order)" 
                  class="btn btn-sm btn-warning me-1"
                  title="Editar"
                  [disabled]="!order?.id">
                  <i class="bi bi-pencil"></i>
                </button>
                <button 
                  (click)="deleteOrder(order?.id)" 
                  class="btn btn-sm btn-danger"
                  title="Eliminar"
                  [disabled]="!order?.id">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <app-order-modal 
      *ngIf="showModal && selectedOrder"
      [order]="selectedOrder"
      [isEditMode]="isEditMode"
      (save)="saveOrder($event)"
      (cancel)="closeModal()">
    </app-order-modal>
  </div>
