<div class="container mt-4">
    <h2 class="mb-4">Administración de Flores</h2>
  
    <div class="d-flex justify-content-between mb-4">
      <button (click)="openCreateModal()" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Nueva Flor
      </button>
  
      <div *ngIf="loading$ | async" class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  
    <div *ngIf="error$ | async as error" class="alert alert-danger">
      {{ error }}
    </div>
  
    <div class="table-responsive">
      <table class="table table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Color</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Temporada</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let flower of flowers$ | async">
            <td>{{ flower?.id }}</td>
            <td>{{ flower?.name }}</td>
            <td>{{ flower?.color }}</td>
            <td>{{ flower?.price | currency:'USD' }}</td>
            <td>
              <ng-container *ngIf="flower as f">
                <span class="badge" [ngClass]="{
                  'bg-success': f.stock > 10,
                  'bg-warning': f.stock <= 10 && f.stock > 0,
                  'bg-danger': f.stock === 0
                }">
                  {{ f.stock }}
                </span>
              </ng-container>
            </td>
            <td>{{ flower?.bloom_season }}</td>
            <td class="text-end">
              <div class="btn-group" role="group">
                <button 
                  (click)="openEditModal(flower)" 
                  class="btn btn-sm btn-warning me-1"
                  title="Editar"
                  [disabled]="!flower?.id">
                  <i class="bi bi-pencil"></i>
                </button>
                <button 
                  (click)="deleteFlower(flower?.id)" 
                  class="btn btn-sm btn-danger"
                  title="Eliminar"
                  [disabled]="!flower?.id">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <app-flower-modal 
      *ngIf="showModal && selectedFlower"
      [flower]="selectedFlower"
      [isEditMode]="isEditMode"
      (save)="saveFlower($event)"
      (cancel)="closeModal()">
    </app-flower-modal>
  </div>
